apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-service-route
  namespace: prometheus-monitoring
spec:
  parentRefs:
    - name: public-gateway # <-- Must match the actual name of your Gateway resource
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /cluster_prometheus/
      filters:
        - type: URLRewrite # <-- This rewrites the path before forwarding
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: my-prometheus-kube-prometh-prometheus
          port: 9090