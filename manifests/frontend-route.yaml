apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-service-route
  namespace: default # Keeps it in the same namespace as your frontend service
spec:
  parentRefs:
    - name: public-gateway # <-- Must match the actual name of your Gateway resource
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-service
          port: 80