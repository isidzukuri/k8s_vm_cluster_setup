apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  namespace: default
  labels:
    app.kubernetes.io/name: frontend-app
    app.kubernetes.io/tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-app
    spec:
      # 🛑 1. Bypass the node's safety block
      tolerations:
      - key: "tier"
        operator: "Equal"
        value: "frontend"
        effect: "NoSchedule"
      
      # 🎯 2. Target the frontend node explicitly
      nodeSelector:
        app.kubernetes.io/tier: "frontend"
      
      containers:
      - name: web-server
        image: traefik/whoami:v1.10
        # image: nginx:1.25-alpine
        # image: kennethreitz/httpbin
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app.kubernetes.io/name: frontend-app